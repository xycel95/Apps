name: Completar subida de SSH Backup

on:
  push:
    branches: [ssh-backup]
    paths: [apps/ssh-backup/.migration/**]

permissions:
  contents: write

concurrency:
  group: completar-ssh-backup
  cancel-in-progress: false

jobs:
  completar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Comprobar si hay archivos pendientes
        id: partes
        shell: bash
        run: |
          if [ -f apps/ssh-backup/.migration/manifest.json ]; then
            echo 'presentes=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruir y verificar los archivos originales
        if: steps.partes.outputs.presentes == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, zipfile
          root = Path.cwd().resolve()
          migration = root / 'apps/ssh-backup/.migration'
          manifest = json.loads((migration / 'manifest.json').read_text())
          for entry in manifest['files']:
              target = root / entry['path']
              if not target.resolve().is_relative_to(root / 'apps/ssh-backup'):
                  raise RuntimeError('Ruta de salida fuera de la aplicación')
              target.parent.mkdir(parents=True, exist_ok=True)
              temporary = target.with_name(target.name + '.assembling')
              digest = hashlib.sha256()
              size = 0
              with temporary.open('wb') as output:
                  for relative in entry['parts']:
                      part = root / relative
                      if not part.resolve().is_relative_to(migration):
                          raise RuntimeError('Parte fuera del directorio de migración')
                      data = part.read_bytes()
                      output.write(data)
                      digest.update(data)
                      size += len(data)
              if size != entry['size'] or digest.hexdigest() != entry['sha256']:
                  temporary.unlink()
                  raise RuntimeError('La integridad del archivo no coincide: ' + entry['path'])
              os.replace(temporary, target)
              if target.suffix.lower() == '.zip':
                  with zipfile.ZipFile(target) as archive:
                      if archive.testzip() is not None:
                          raise RuntimeError('La comprobación CRC del ZIP ha fallado')
              print('Verificado:', entry['path'], digest.hexdigest())
          shutil.rmtree(migration)
          PY
      - name: Publicar los archivos completos
        if: steps.partes.outputs.presentes == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- apps/ssh-backup/Codigo/deps/lib/BouncyCastle.Cryptography.dll apps/ssh-backup/descargas/SSHBackup_Completo_2.1.0.zip
          git add -u -- apps/ssh-backup/.migration
          git commit -m 'Publicar entrega original SSH Backup 2.1.0 y verificar integridad'
          git push origin HEAD:refs/heads/ssh-backup
