name: Publicación inicial de Visor Tapo 1.1.0

on:
  push:
    branches: [visor-tapo]
    paths:
      - .github/workflows/visor-tapo-publicacion-1.1.0.yml

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/visor-tapo/Codigo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libopengl0
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verificar código y reproducción con medios sintéticos
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          VISOR_TAPO_DATA: ${{ runner.temp }}/visor-tapo-pruebas
        run: |
          python -m unittest discover -s tests -v
          python tests/ui_smoke.py
      - name: Crear paquete Windows y comprobar dependencias fijadas
        run: python build_windows.py
      - name: Publicar los paquetes comprobados
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publicar_github.py
