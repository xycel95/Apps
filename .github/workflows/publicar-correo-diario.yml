name: Publicar CorreoDiario 0.1 beta
on:
  push:
    branches: [correo-diario]
    paths:
      - '.github/workflows/publicar-correo-diario.yml'
permissions:
  contents: write
concurrency:
  group: publicar-correo-diario-0-1-beta
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/correo-diario/Codigo/global.json
      - name: Preparar carpeta de publicación
        shell: pwsh
        run: New-Item -ItemType Directory -Force .correo-release | Out-Null
      - name: Comprobar la lógica de exportación y borrado
        shell: pwsh
        run: |
          Set-Location apps/correo-diario/Codigo
          dotnet run --project tests/CorreoDiario.SafetyTests/CorreoDiario.SafetyTests.csproj -c Release 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE/.correo-release/PRUEBAS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Han fallado las pruebas de lógica.' }
      - name: Compilar el ejecutable único para Windows
        shell: pwsh
        run: |
          Set-Location apps/correo-diario/Codigo
          dotnet publish src/CorreoDiario.Windows/CorreoDiario.Windows.csproj -c Release -o "$env:GITHUB_WORKSPACE/.correo-publish"
          if ($LASTEXITCODE -ne 0) { throw 'Ha fallado la compilación.' }
      - name: Comprobar el arranque y la casilla por defecto
        shell: pwsh
        run: ./apps/correo-diario/Codigo/packaging/Validate-Native.ps1
      - name: Preparar los archivos y sus comprobaciones
        shell: pwsh
        run: |
          python apps/correo-diario/Codigo/packaging/build_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Ha fallado la preparación de los archivos.' }
      - name: Publicar la beta con ejecutable, ZIP y fuentes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem .correo-release -File).FullName
          gh release create correo-diario-v0.1.0-beta.1 --target $env:GITHUB_SHA --title 'CorreoDiario 0.1 beta' --prerelease --latest=false --notes-file apps/correo-diario/notas-de-parche/README.md @files
          if ($LASTEXITCODE -ne 0) { throw 'No se ha podido crear la publicación.' }
      - name: Actualizar la descarga y retirar el disparador temporal
        shell: pwsh
        run: |
          Remove-Item .github/workflows/publicar-correo-diario.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/correo-diario/app.json apps/correo-diario/descargas apps/correo-diario/docs/VALIDACION-WINDOWS.json .github/workflows/publicar-correo-diario.yml
          git commit -m 'Publicar CorreoDiario 0.1 beta con comprobaciones de Windows y retirar el flujo temporal'
          if ($LASTEXITCODE -ne 0) { throw 'No se ha podido registrar el estado de la publicación.' }
          git push origin HEAD:correo-diario
          if ($LASTEXITCODE -ne 0) { throw 'La publicación existe pero no se ha podido actualizar su documentación.' }
