name: Publicar CorreoDiario 0.3.1 con búsqueda por fecha
on:
  push:
    branches: [correo-diario]
    paths: ['.github/workflows/publicar-correo-diario-031.yml']
permissions:
  contents: write
concurrency:
  group: publicar-correo-diario-0-3-1-beta
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/correo-diario/Codigo/global.json
      - name: Preparar publicación
        shell: pwsh
        run: New-Item -ItemType Directory -Force .correo-release | Out-Null
      - name: Comprobar exportación, borrado y selección de pestañas
        shell: pwsh
        run: |
          Set-Location apps/correo-diario/Codigo
          dotnet run --project tests/CorreoDiario.SafetyTests/CorreoDiario.SafetyTests.csproj -c Release 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE/.correo-release/PRUEBAS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Han fallado las pruebas de lógica.' }
      - name: Comprobar el transporte local del navegador
        shell: pwsh
        run: |
          Set-Location apps/correo-diario/Codigo
          dotnet run --project tests/CorreoDiario.SafetyTests/CorreoDiario.SafetyTests.csproj -c Release -- --verify-browser-bridge 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE/.correo-release/BROWSER-BRIDGE.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Ha fallado la prueba de conexión local.' }
      - name: Reproducir y corregir 401 con Edge real y servicio HTTPS sintético
        timeout-minutes: 3
        shell: pwsh
        run: |
          Set-Location apps/correo-diario/Codigo
          dotnet run --project tests/CorreoDiario.SafetyTests/CorreoDiario.SafetyTests.csproj -c Release -- --verify-outlook-auth 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE/.correo-release/OUTLOOK-AUTH.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Ha fallado la regresión autenticada con Edge.' }
      - name: Comprobar búsqueda y exportación con PDF de WebView2 real
        timeout-minutes: 5
        shell: pwsh
        run: |
          Set-Location apps/correo-diario/Codigo
          dotnet run --project tests/CorreoDiario.WindowsChecks/CorreoDiario.WindowsChecks.csproj -c Release 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE/.correo-release/PDF-REAL.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Ha fallado la exportación con el renderizador real de Windows.' }
      - name: Compilar el ejecutable de Windows
        shell: pwsh
        run: |
          Set-Location apps/correo-diario/Codigo
          dotnet publish src/CorreoDiario.Windows/CorreoDiario.Windows.csproj -c Release -o "$env:GITHUB_WORKSPACE/.correo-publish"
          if ($LASTEXITCODE -ne 0) { throw 'Ha fallado la compilación.' }
      - name: Comprobar la interfaz sin inicio de sesión integrado
        shell: pwsh
        run: ./apps/correo-diario/Codigo/packaging/Validate-Native.ps1
      - name: Preparar descargas e integridad
        shell: pwsh
        run: |
          python apps/correo-diario/Codigo/packaging/build_release.py
          if ($LASTEXITCODE -ne 0) { throw 'No se han podido preparar los archivos.' }
      - name: Publicar la beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem .correo-release -File).FullName
          gh release create correo-diario-v0.3.1-beta.1 --target $env:GITHUB_SHA --title 'CorreoDiario 0.3.1 beta · Corrección de búsqueda por fecha' --prerelease --latest=false --notes-file apps/correo-diario/Codigo/packaging/RELEASE-NOTES.md @files
          if ($LASTEXITCODE -ne 0) { throw 'No se ha podido publicar la beta.' }
      - name: Registrar la publicación y retirar el flujo temporal
        shell: pwsh
        run: |
          Remove-Item .github/workflows/publicar-correo-diario-031.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/correo-diario/app.json apps/correo-diario/descargas apps/correo-diario/docs/VALIDACION-WINDOWS.json .github/workflows/publicar-correo-diario-031.yml
          git commit -m 'Publicar CorreoDiario 0.3.1 beta con navegador abierto y retirar el flujo temporal'
          if ($LASTEXITCODE -ne 0) { throw 'No se ha podido registrar el resultado.' }
          git push origin HEAD:correo-diario
          if ($LASTEXITCODE -ne 0) { throw 'La publicación existe pero su documentación no se ha actualizado.' }
