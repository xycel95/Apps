# Publicación única; la prueba espera la liberación de los archivos tras cerrar.
name: Publicar Sintonía 1.0.1 sin listas
on:
  push:
    branches: [sintonia]
    paths: [.github/workflows/publish-sintonia-1.0.1.yml]
permissions:
  contents: write
concurrency:
  group: sintonia-publicacion-1.0.1
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Preparar, comprobar y compilar
        working-directory: apps/sintonia/Codigo
        run: ./packaging/build.ps1
      - name: Comprobar el ejecutable en Windows
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          ./apps/sintonia/Codigo/packaging/Validate-Windows.ps1 -Executable apps/sintonia/Codigo/salida/Sintonia.exe -Report release/VALIDACION-WINDOWS.json
      - name: Preparar programa, fuentes y huellas
        run: |
          $ErrorActionPreference = 'Stop'
          $code = Join-Path $PWD 'apps/sintonia/Codigo'
          Copy-Item "$code/salida/Sintonia.exe" release/Sintonia_1.0.1_Windows.exe
          $stage = Join-Path $env:RUNNER_TEMP 'SintoniaPackage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$code/salida/Sintonia.exe" "$stage/Sintonia.exe"
          Copy-Item "$code/LEEME.txt" "$stage/LEEME.txt"
          Copy-Item "$code/src/Sintonia.App/Assets/THIRD-PARTY-NOTICES.txt" "$stage/Licencias.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath release/Sintonia_1.0.1_Windows.zip
          $source = Join-Path $env:RUNNER_TEMP 'SintoniaSource/Sintonia'
          New-Item -ItemType Directory -Force $source | Out-Null
          $prefix = 'apps/sintonia/Codigo/'
          foreach ($tracked in (git ls-files apps/sintonia/Codigo)) {
            $relative = $tracked.Substring($prefix.Length)
            $destination = Join-Path $source $relative
            New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
            Copy-Item $tracked $destination
          }
          Copy-Item "$code/src/Sintonia.App/Assets/vlc-win-x64.zip" "$source/src/Sintonia.App/Assets/vlc-win-x64.zip"
          New-Item -ItemType Directory -Force "$source/vendor-source" | Out-Null
          Invoke-WebRequest -Uri 'https://download.videolan.org/pub/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz' -OutFile "$source/vendor-source/vlc-3.0.24.tar.xz"
          Invoke-WebRequest -Uri 'https://code.videolan.org/videolan/LibVLCSharp/-/archive/3082c09ca955131c705fc4767fde03e9c4a14999/LibVLCSharp-3082c09ca955131c705fc4767fde03e9c4a14999.tar.gz' -OutFile "$source/vendor-source/LibVLCSharp-3.10.2.tar.gz"
          Compress-Archive -Path $source -DestinationPath release/Sintonia_1.0.1_CodigoFuente.zip
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content -Encoding ascii release/SHA256SUMS.txt
          @'
          Sintonía 1.0.1 para Windows 10/11 x64. Ahora empieza vacía.

          Descarga el EXE y ábrelo directamente, o extrae el ZIP y abre Sintonia.exe.
          Incluye .NET y LibVLC: no necesita dependencias instaladas.

          Sin listas ni canales precargados. Añade tus propias fuentes M3U o emisiones directas. Se retira solo la lista automática antigua y se conservan tus listas, favoritos y volumen.
          La app no certifica los derechos de las fuentes añadidas ni elude suscripciones, DRM o restricciones geográficas.

          Comprobado en Windows: 30 comprobaciones, arranque vacío con cero fuentes, migración que conserva las listas del usuario, creación de ventana e inicio de VLC, ejecución desde carpeta vacía y después de mover/renombrar el EXE. El ensayo nativo no reproduce emisiones: la reproducción completa de directos en el EXE sigue pendiente de validación.

          Guía: https://github.com/xycel95/Apps/blob/sintonia/apps/sintonia/docs/README.md
          Descripción: https://github.com/xycel95/Apps/blob/sintonia/apps/sintonia/DESCRIPCION.md
          Notas: https://github.com/xycel95/Apps/blob/sintonia/apps/sintonia/notas-de-parche/README.md
          '@ | Set-Content -Encoding utf8 release-notes.txt
      - name: Publicar archivos comprobados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create sintonia-v1.0.1 --repo xycel95/Apps --target $env:GITHUB_SHA --title 'Sintonía 1.0.1' --notes-file release-notes.txt --latest=false release/Sintonia_1.0.1_Windows.exe release/Sintonia_1.0.1_Windows.zip release/Sintonia_1.0.1_CodigoFuente.zip release/SHA256SUMS.txt release/VALIDACION-WINDOWS.json
          if ($LASTEXITCODE -ne 0) { throw 'La publicación no se ha completado.' }

